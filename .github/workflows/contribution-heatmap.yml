name: Contribution Heatmap

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-contribution-heatmap
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
          OUTPUT_PATH: assets/heatmap.svg
        run: python3 scripts/generate_heatmap.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          V=$(date -u +%Y%m%d%H%M)
          sed -i -E "s#(assets/heatmap\.svg)(\?v=[0-9]+)?#\1?v=${V}#g" README.md
          git add assets README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update contribution heatmap"
            git push
          fi
